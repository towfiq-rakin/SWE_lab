{% extends "auctions/layout.html" %}

{% block body %}
<h2>Create Listing</h2>

<form action="{% url 'create' %}" method="post">
    {% csrf_token %}
    <div class="form-group">
        <input class="form-control" type="text" name="title" placeholder="Title" required>
    </div>
    <div class="form-group">
        <textarea class="form-control" name="description" placeholder="Description" rows="4" required></textarea>
    </div>
    <div class="form-group">
        <input class="form-control" type="number" name="start_price" placeholder="Starting Bid" step="0.01" min="0"
            required>
    </div>
    <div class="form-group">
        <input class="form-control" type="url" name="image_url" placeholder="Image URL (Optional)">
    </div>
    <div class="form-group">
        <input class="form-control" type="text" name="category" placeholder="Category (Optional)">
    </div>
    <input class="btn btn-primary" type="submit" value="Create Listing">
</form>
{% endblock %}
